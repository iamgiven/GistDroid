name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Require signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Releases must be signed: set the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets"
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GistDroid-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          # This version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          fingerprint=$(keytool -list -v -storetype pkcs12 -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: *//p' | head -n 1)
          {
            echo
            echo "### Verify"
            echo
            echo "Signing certificate SHA-256: \`$fingerprint\`"
            echo
            echo "APK checksums are in \`SHA256SUMS.txt\`."
          } >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: GistDroid ${{ env.VERSION }}
          body_path: notes.md
          files: dist/*

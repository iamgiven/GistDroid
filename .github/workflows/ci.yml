name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty for pull requests from forks: the APK is then left unsigned.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_SUFFIX: -dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          suffix=$([ -n "$KEYSTORE_BASE64" ] || echo "-unsigned")
          cp "$apk" "dist/GistDroid-${version}${VERSION_SUFFIX}${suffix}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: GistDroid-apk
          path: dist/*.apk
          retention-days: 30

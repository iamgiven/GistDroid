name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could GistDroid help?
      description: The behavior you'd like. Mockups or screenshots are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other ways you've considered or work around it today.
